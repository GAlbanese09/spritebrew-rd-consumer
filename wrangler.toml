# spritebrew-rd-consumer/wrangler.toml
# Established 2026-05-07 — Session 15 continued morning.
# Architectural reference: Confluence 87490562 + 87588866.

name = "spritebrew-rd-consumer"
main = "src/index.ts"
compatibility_date = "2026-04-03"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 300000  # 5 min defensive headroom (RD calls take 90-120s wall-clock; CPU is near-zero since await fetch is I/O wait)

# === Production ===
[env.production]
name = "spritebrew-rd-consumer"

# A Worker cannot tell from its bindings which environment it runs in; the
# D1 event ledger stamps every row with this.
[env.production.vars]
APP_ENV = "production"

[[env.production.queues.consumers]]
queue = "spritebrew-rd-jobs"
max_batch_size = 1                  # one RD call per invocation
max_batch_timeout = 0               # don't wait to batch
max_retries = 3                     # try original + 3 retries before DLQ
dead_letter_queue = "spritebrew-rd-jobs-dlq"

# Cron: stale-running sweep (scheduled handler in src/index.ts). Every 15 min.
[env.production.triggers]
crons = ["*/15 * * * *"]

[[env.production.kv_namespaces]]
binding = "SPRITEBREW_KV"
id = "ed99497beaaa432f88000689ab78821c"

[[env.production.r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "spritebrew-gallery"

# D1 event ledger (WD2a). Observability only; token_tx:* in KV stays the money
# truth and recordEvent never blocks or fails a job. Migrations in ./migrations.
[[env.production.d1_databases]]
binding = "EVENTS_DB"
database_name = "spritebrew-events"
database_id = "fb33d2dc-cfdc-4ed3-9311-12abaf951816"
migrations_dir = "migrations"

# Observability: enabled in the dashboard 2026-09-18 after the discovery that
# every log('warn') the consumer writes about an RD failure or a rescue was
# being discarded. Declared here so a deploy cannot silently switch it back
# off, since wrangler deploys whatever this file says.
[env.production.observability.logs]
enabled = true
invocation_logs = true
persist = true

# RETRO_DIFFUSION_API_KEY set via:
#   npx wrangler secret put RETRO_DIFFUSION_API_KEY --env production

# === Preview/dev ===
[env.preview]
name = "spritebrew-rd-consumer-dev"

[env.preview.vars]
APP_ENV = "dev"

[[env.preview.queues.consumers]]
queue = "spritebrew-rd-jobs-dev"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
dead_letter_queue = "spritebrew-rd-jobs-dlq-dev"

# Cron: stale-running sweep (scheduled handler in src/index.ts). Every 15 min.
[env.preview.triggers]
crons = ["*/15 * * * *"]

[[env.preview.kv_namespaces]]
binding = "SPRITEBREW_KV"
id = "18dd9502fdde4a2ea76f9b9eb9cc5e8b"

[[env.preview.r2_buckets]]
binding = "GALLERY_BUCKET"
bucket_name = "spritebrew-gallery-dev"

[[env.preview.d1_databases]]
binding = "EVENTS_DB"
database_name = "spritebrew-events-dev"
database_id = "c7ca1a93-a1f9-477b-b056-1b4f7b434a95"
migrations_dir = "migrations"

[env.preview.observability.logs]
enabled = true
invocation_logs = true
persist = true
